prefixes:
  ex:   http://www.example.com/
  foaf: http://xmlns.com/foaf/0.1/
  oa:   http://www.w3.org/ns/oa#
  prov: http://www.w3.org/ns/prov#
  rdf:  http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  rr:   http://www.w3.org/ns/r2rml#
  xsd:  http://www.w3.org/2001/XMLSchema#


sources:
  events_source:
    access: csv/events.csv
    referenceFormulation: csv
  claims_source:
    access: csv/claims.csv
    referenceFormulation: csv
  experts_source:
    access: csv/experts.csv
    referenceFormulation: csv
  resources_source:
    access: csv/resources.csv
    referenceFormulation: csv
  kengineers_source:
    access: csv/kEngineers.csv
    referenceFormulation: csv
  formalRepresentation_source:
    access: csv/formalRepresentations.csv
    referenceFormulation: csv
  assessments_source:
    access: csv/assessments.csv
    referenceFormulation: csv
  cqs_source:
    access: csv/CQs.csv
    referenceFormulation: csv
  formalcqs_source:
    access: csv/formalCQs.csv
    referenceFormulation: csv

mappings:
# BEGIN: CLAIM GENERATION NETWORK
  event:
    sources:
      - events_source
    s: ex:$(eventID)
    po:
      - [a, [ex:Event, prov:Activity]]
      - p: prov:wasAssociatedWith
        o:
          mapping: expert
          condition:
            function: equal
            parameters:
            - [str1, $(attendedBy)]
            - [str2, $(expertID)]
      - p: prov:generated
        o:
          mapping: resource
          condition:
            function: equal
            parameters:
            - [str1, $(outcome)]
            - [str2, $(resourceID)]

  expert:
    sources:
      - experts_source
    s: ex:$(expertID)
    po:
      - [a, [ex:DomainExpert, foaf:Agent, prov:Agent]]
      - [foaf:name, $(firstName) $(lastName)]
      - p: prov:contributed
        o:
          mapping: resource
          condition:
            function: equal
            parameters:
              - [str1, $(expertID)]
              - [str2, $(contributor)]

  resource:
    sources:
      - resources_source
    s: ex:$(resourceID)
    po:
      - [a, [ex:Resource, prov:Entity]]
      - [rdfs:label, $(title)]

  claim:
    sources:
      - claims_source
    s: ex:$(claimID)
    po:
      - [a, [ex:Claim, oa:Annotation, prov:Entity]]
      - [oa:bodyValue, $(content)]
      - [rdfs:comment, $(explanation)]
      - p: prov:wasRevisionOf
        o: 
          value: ex:$(target)
          type: iri
          condition:
              function: equal
              parameters:
                  - [str1, $(revision)]
                  - [str2, yes]
      - p: prov:wasAttributedTo
        o:
          mapping: expert
          condition:
            function: equal
            parameters:
              - [str1, $(owner)]
              - [str2, $(expertID)]
      - p: oa:hasTarget
        o: 
          mapping: claim_target
          condition:
            function: equal
            parameters:
              - [str1, $(claimID)]
              - [str2, $(claimID)]
    
  claim_target:
    sources:
      - claims_source
    s:
      value: $(claimID)_claim_target
      type: blank
    po:
      - [a, oa:SpecificResource]
      - [oa:hasSource, ex:$(target)~iri]
      - p: oa:hasSelector
        o:
          mapping: claim_selector
          condition:
            function: equal
            parameters:
              - [str1, $(claimID)]
              - [str2, $(claimID)]

  claim_selector:
    sources:
      - claims_source
    s:
      value: $(claimID)_claim_selector
      type: blank
    po:
      - [a, oa:TextQuoteSelector]
      - [oa:exact, $(selectorPhrase)]

# END: CLAIM GENERATION NETWORK

# BEGIN: CLAIM FORMALIZATION NETWORK
  kengineer:
      sources:
        - kengineers_source
      s: ex:$(kEngineerID)
      po:
        - [a, [ex:KnowledgeEngineer, foaf:Agent, prov:Agent]]
        - [foaf:name, $(firstName) $(lastName)]
        - [foaf:knows, ex:$(knows)~iri]

  formal_representation:
      sources:
        - formalRepresentation_source
      s: ex:$(formalID)
      po:
        - [a, [ex:FormalRepresentation, oa:Annotation, prov:Entity]]
        - [oa:bodyValue, $(content)]
        - [rdfs:comment, $(explanation)]
        - [ex:hasFormat, $(format)]
        - p: prov:wasAttributedTo
          o:
            mapping: kengineer
            condition:
              function: equal
              parameters:
                - [str1, $(owner)]
                - [str2, $(kEngineerID)]
        - p: oa:hasTarget
          o: 
            mapping: formal_representation_target
            condition:
              function: equal
              parameters:
                - [str1, $(formalID)]
                - [str2, $(formalID)]
      
  formal_representation_target:
    sources:
      - formalRepresentation_source
    s:
      value: $(formalID)_formal_representation_target
      type: blank
    po:
      - [a, oa:SpecificResource]
      - [oa:hasSource, ex:$(target)~iri]
      - p: oa:hasSelector
        o:
          mapping: formal_representation_selector
          condition:
            function: equal
            parameters:
              - [str1, $(formalID)]
              - [str2, $(formalID)]

  formal_representation_selector:
    sources:
      - formalRepresentation_source
    s:
      value: $(formalID)_formal_representation_selector
      type: blank
    po:
      - [a, oa:TextQuoteSelector]
      - [oa:exact, $(selectorPhrase)]

  assessment:
      sources:
        - assessments_source
      s: ex:$(assessmentID)
      po:
        - [a, [ex:Assessment, oa:Annotation, prov:Entity]]
        - [oa:bodyValue, $(content)]
        - [oa:motivatedBy, oa:assessing~iri]
        - [ex:agreement, $(agreement)]
        - [oa:hasTarget, ex:$(target)~iri]
        - p: prov:wasAttributedTo
          o:
            mapping: kengineer
            condition:
              function: equal
              parameters:
                - [str1, $(owner)]
                - [str2, $(kEngineerID)]
       
  
# END: CLAIM FORMALIZATION NETWORK

# BEGIN: COMPETENCY QUESTIONS
  cq:
      sources:
        - cqs_source
      s: ex:$(cqID)
      po:
        - [a, [ex:CompetencyQuestion, oa:Annotation, prov:Entity]]
        - [oa:bodyValue, $(content)]
        - [rdfs:comment, $(explanation)]
        - [ex:hasTarget, $(target)]
        - p: prov:wasAttributedTo
          o:
            mapping: kengineer
            condition:
              function: equal
              parameters:
                - [str1, $(owner)]
                - [str2, $(kEngineerID)]
    
  formal_cq:
      sources:
        - formalcqs_source
      s: ex:$(formalCqID)
      po:
        - [a, [ex:FormalCompetencyQuestion, oa:Annotation, prov:Entity]]
        - [oa:bodyValue, $(content)]
        - [rdfs:comment, $(explanation)]
        - [ex:hasFormat, $(format)]
        - p: prov:wasAttributedTo
          o:
            mapping: kengineer
            condition:
              function: equal
              parameters:
                - [str1, $(owner)]
                - [str2, $(kEngineerID)]
        - p: oa:hasTarget
          o: 
            mapping: formal_cq_target
            condition:
              function: equal
              parameters:
                - [str1, $(formalCqID)]
                - [str2, $(formalCqID)]

  formal_cq_target:
    sources:
      - formalcqs_source
    s:
      value: $(formalCqID)_formal_cq_target
      type: blank
    po:
      - [a, oa:SpecificResource]
      - [oa:hasSource, ex:$(target)~iri]
      - p: oa:hasSelector
        o:
          mapping: formal_cq_selector
          condition:
            function: equal
            parameters:
              - [str1, $(formalCqID)]
              - [str2, $(formalCqID)]
  formal_cq_selector:
    sources:
      - formalcqs_source
    s:
      value: $(formalCqID)_formal_cq_selector
      type: blank
    po:
      - [a, oa:TextQuoteSelector]
      - [oa:exact, $(selectorPhrase)]

# END: COMPETENCY QUESTIONS